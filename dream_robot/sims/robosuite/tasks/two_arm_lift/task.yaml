# two_arm_lift -- robosuite / Panda + Panda
#
# T6 in ROADMAP's task matrix: the coordination axis. Two arms, one pot, one
# handle each; the pot only rises if both arms grasp and lift together.
#
# Deliberately NOT "one holds, other inserts". That bundles coordination with
# T3's precision-and-contact axis, and the matrix asks each task to isolate one.
# See experiments/t6/notes.md for why robosuite's own TwoArmPegInHole was
# rejected (it has no grippers at all, so it cannot be expressed in spec.md's
# action contract).

name: two_arm_lift
sim: robosuite
robot: Panda + Panda

prompt: lift the pot with both arms

control:
  hz: 30                    # spec.md, frozen, same as every other task
  horizon_seconds: 20.0

cameras:
  height: 128
  width: 128
  # backend name -> canonical name.
  #
  # Three cameras, not two. A bimanual scene has two wrist cameras and the
  # single-arm contract has one `wrist` slot; `wrist_left` / `wrist_right` were
  # added to CANONICAL_CAMERAS for exactly this, additively, so T1 and T2
  # datasets still validate unchanged.
  #
  # Which arm is which: in the `parallel` arrangement robot0's base sits at
  # y = -0.25 and robot1's at y = +0.25, and +y is screen-right in the front
  # camera (the same convention that made T2's y = +0.20 bin the "right" one).
  # So robot0 is the left arm and robot1 the right.
  # birdview, not T1's agentview. Compared at 128 px in scratch/t6/cameras.png:
  # agentview frames the pot beautifully and puts BOTH arms out of frame, and
  # its side-on angle hides the marbles inside the pot until they spill.
  # frontview sees both arms but the pot is ~20 px wide. birdview is the only
  # one carrying all three things this task depends on -- both grippers, the
  # pot's yaw (the randomised variable), and the marbles.
  # FOUR cameras, each with a job. Framing is judged against the job, not
  # against how the picture looks to a human:
  #
  #   top         tight overhead -- the tray's yaw, and where each gripper sits
  #               relative to its own handle. Wants pixels on the tray.
  #   front       wide room view -- the whole situation, and height above the
  #               table, which a straight-down view cannot show at all.
  #   wrist_*     one per arm -- am I on the handle, and is it time to close.
  #
  # This is ALOHA's set, which ACT was built on. The pairing matters more than
  # either camera: tight overhead alone loses height, wide room alone loses the
  # handle, and the wrists are blind until they are already close.
  workspace:
    # Metres of table the frame spans. The tray is 14 cm wide and both grippers
    # must be visible through the lift, which carries the tray 25 cm up -- and
    # up here means TOWARD the camera, so the frame only gets tighter.
    frame_width: 0.55
    fovy: 45.0

  # The room-level view, and the reason there are four cameras here rather than
  # three: straight down cannot show how high a gripper is above the table, and
  # BC's dominant failure is never closing on a handle at all. ALOHA, which ACT
  # was built on, ran exactly this set -- overhead, front, one per wrist.
  front:
    # Bolted down, not tracking. A camera that follows the tray is a privileged
    # view no real cell has; this one is aimed once and left alone.
    distance: 0.60          # metres in front of the table centre
    height: 0.30            # metres above the table top
    # Aimed above the table rather than at it: the lift carries the tray 25 cm
    # up, so pointing at the surface spends the decisive seconds looking under
    # the action. Half the lift height keeps both the grasp and the top in frame.
    look_at_height: 0.12
    fovy: 60.0

  mapping:
    workspace: top
    front_cam: front
    robot0_eye_in_hand: wrist_left
    robot1_eye_in_hand: wrist_right

render:
  # frontview sees both arms and the pot between them. birdview and sideview
  # both drop one arm out of frame at the lift.
  camera: frontview
  # 768: the demo panel stacks the policy's three 128 px cameras beside this
  # wide view at integer scale, so the height has to be a multiple of 3 x 128.
  # 384 satisfies that but renders the tray small on a laptop; 768 is the next
  # one up and gives the human view real detail. The camera column stays at its
  # true 128 px, doubled with nearest-neighbour -- it looks blocky because that
  # IS the policy's input, and a smoothed version would hide what it can see.
  height: 768
  width: 768

scene:
  # `parallel` puts both bases on the -x side of the table, side by side, like
  # an ALOHA-style two-arm station. `opposed` faces them across the table, which
  # renders worse from any single camera and is further from the two-arm rigs
  # this is meant to transfer to.
  arrangement: parallel
  table_full_size: [0.8, 0.8, 0.05]

  # Marbles on the tray. Without them a tilted lift still scores: success is a
  # height threshold and the tray's angle is free. Marbles make the tilt cost
  # something -- they roll off, and that is visible in the video rather than
  # only in a tilt column nobody watches. They also rehearse T4 (pour N balls),
  # which is the same trick: rigid spheres standing in for a fluid.
  marbles:
    # A FULL tray of small balls, not a handful of big ones. The count is the
    # measurement axis: 9 large balls share one escape angle and leave together,
    # so the spill was pass/fail. 25 small ones packed edge to edge have no
    # run-up and have to queue at the rim, so they leave in groups and the count
    # reports HOW FAR the tray tipped, not just that it did:
    #
    #   tilt      15°  20°  25°  30°  35°  40°  45°
    #   aboard     25   25   21   15   15   12    0
    #
    # Swept over ball size x rim ratio x fill in
    # experiments/t6/scripts/graded_spill.py; this is the only corner that both
    # starts full below 20 deg and grades monotonically after.
    count: 25
    radius: 0.010
    # Constant density against the old 18 mm / 20 g ball, so the payload falls
    # with the volume rather than the task quietly getting heavier.
    mass: 0.0034
    # Fraction that must still be aboard for the lift to count: 19 of 25.
    keep_fraction: 0.75

  # A TRAY, not robosuite's pot -- see tray.py. The pot is a 12 cm box with
  # 13 cm walls, and a ball never escapes a wall taller than itself, so its
  # contents sit tight until it is past 90 degrees. Measured across every fill
  # and depth in scripts/t6_spill_curve.py.
  tray:
    # The angle the tray was designed around: documentation, not an input. The
    # rim below is chosen by sweep, not by solving for this number -- a packed
    # tray's onset is set by crowding as much as by geometry.
    spill_angle_deg: 45.0
    # Lip height as a multiple of the ball radius. Ball radius r, lip L:
    #
    #   tan θ_escape = √(2rL − L²) / (r − L)
    #
    # for ONE ball resting against the lip, which gives L = r·(1 − cos θ) and so
    # 0.293 r for a 45 deg escape. A packed tray is not one ball: the balls
    # behind push the front row over a rim that would hold them alone, so a full
    # tray at 0.293 r sheds everything by 15 deg. 0.60 r restores the onset to
    # 25 deg with the tray full, and the crowding that cost us the margin is
    # what buys the graded curve above.
    #
    # Two earlier values, both wrong and both worth remembering. 0.76 r was
    # "measured" in scripts/t6_spill_curve.py, which tilts the tray first and
    # drops the balls in so they roll its full length and hop a rim that would
    # statically hold them -- the scene tilts slowly with the balls already at
    # rest, so that rig measures a regime the task never enters, and 0.76 r put
    # the real escape angle at 76 deg. 0.293 r then fixed the angle but only for
    # a sparse tray. See experiments/t6/notes.md, steps 2c-2g.
    lip_over_radius: 0.60
    handle_height: 0.055

success:
  # Pot bottom must clear the table top by this much. Same quantity robosuite's
  # own _check_success uses, recomputed here so the number lives in this file
  # rather than inside the backend.
  lift_height: 0.10
  # ...and STILL clear it this many seconds later, with the marbles aboard.
  #
  # Without the hold, success fires the instant the tray crosses the height, and
  # a tray hoisted at 48 degrees scored a clean success -- it had not yet had
  # time to fall or to spill. Two seconds is enough for both: measured, a lift
  # that reaches 57 deg as the height fires is back on the table by then.
  #
  # This is why `failure.tilt_threshold_deg` is NOT a success condition. One
  # physical statement -- lifted, still lifted, still full -- beats three
  # thresholds, and the angle stays where it is useful: labelling the failure.
  hold_seconds: 2.0

failure:
  # Pot's own z axis vs world z. Past this the pot has been tipped rather than
  # lifted -- the visible signature of two arms pulling out of sync.
  #
  # This is the NUMERIC failure line. The marbles cannot be it: measured in
  # scripts/t6_spill_curve.py, an open box does not spill below ~90 deg at any
  # fill or depth, because for tilt < 90 deg gravity still has a component
  # pointing INTO the pot and the contents pile against a wall instead of
  # reaching the rim. The marbles catch outright dumps on video; this catches
  # the merely-botched lifts.
  tilt_threshold_deg: 45.0
  # Fraction of lift_height the pot must have reached at some point to count as
  # "had it and lost it" rather than "never got it off the table".
  dropped_lift_fraction: 0.5

# The scripted expert. Written in step 2; the numbers below are the ones the
# phase machine reads, and they are tuned against this scene, not inherited.
expert:
  approach_height: 0.10       # hover above the handle before descending
  grasp_dz: 0.005             # grip-site target relative to handle centre
  lift_height: 0.25           # above the grasp point

  reach_tolerance: 0.015
  fine_tolerance: 0.010
  lift_clearance: 0.03

  # Coordination, as a predicate rather than a wait. Neither arm advances out
  # of a phase until BOTH arms satisfy that phase -- this is the one structural
  # difference from T1's expert and the entire reason the task is interesting.
  # A per-arm phase machine with no barrier produces exactly the failure the
  # policies are supposed to be tested on, in the demonstrations themselves.
  sync_barrier: true

  grip_settle_window: 4
  grip_settle_epsilon: 2.5e-3

  phase_timeout_seconds: 5.0

  ik:
    damping: 0.15
    max_joint_step: 0.06
